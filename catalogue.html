<body data-page="catalogue">
<noscript>
  <div class="noscript-msg">
    <h1>La boutique a besoin de JavaScript</h1>
    <p>Votre navigateur ne l'exécute pas. C'est souvent le cas en
       <b>mode économie de données</b> ou <b>navigation allégée</b> :

    <p>Vous pouvez aussi commander directement :</p>

  </div>

<main id="page">
<section class="section" id="produits" data-od-id="products">
    <div class="wrap">
      <div class="sec-head">
        <span class="sec-kicker" id="pgKicker">Toutes les marques</span>
        <h1 class="sec-title" id="pgTitre" data-anchor="nouveautes" data-od-id="products-title">Le catalogue</h1>
        <p class="sec-sub" id="pgSub">Toutes les paires en stock, toutes marques confondues. Filtrez par type ci-dessous.</p>
      </div>
      <div class="audience-tabs" id="audienceTabs" aria-label="Rayon"></div>
      <div class="tabs" id="filterTabs" data-od-id="filter-tabs" role="tablist">
        <button class="tab active" data-filter="tous">Tous</button>
      </div>
      <div class="cat-tools" id="catTools" hidden>
        <div class="cat-tools-row">
          <button type="button" class="cat-btn" id="catFiltrer" aria-expanded="false" aria-controls="catPanel">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span>Filtrer</span><span class="cat-count" id="catCount" hidden>0</span>
          </button>
          <label class="cat-sort">
            <span>Trier</span>
            <select id="catTri" aria-label="Ordre d'affichage">
              <option value="defaut">Sélection boutique</option>
              <option value="prix-asc">Prix croissant</option>
              <option value="prix-desc">Prix décroissant</option>
              <option value="nouveau">Nouveautés d'abord</option>
              <option value="nom">Nom A à Z</option>
            </select>
          </label>
          <p class="cat-total" id="catTotal" role="status" aria-live="polite"></p>
        </div>
        <div class="cat-panel-wrap" id="catPanelWrap" data-open="false">
          <div class="cat-panel" id="catPanel"></div>
        </div>
        <div class="cat-actives" id="catActives" hidden></div>
      </div>
      <div class="pgrid" id="grid" data-od-id="product-grid"></div>
    </div>
  </section>

  <section class="news" id="nlSection" data-od-id="newsletter">
    <div class="wrap">
      <span class="sec-kicker" id="nlKicker" style="justify-content:center;color:color-mix(in srgb,#ffffff 60%,transparent);margin-bottom:18px"></span>
      <h2 id="nlTitre"></h2>
      <p id="nlTexte"></p>
      <form class="news-form" id="newsForm" data-od-id="newsletter-form" novalidate>
        <input type="email" id="newsEmail" placeholder="ton@email.com" aria-label="Adresse e-mail" required />
        <button type="submit" class="btn btn-light" data-od-id="newsletter-submit">S'inscrire</button>
      </form>
      <p class="news-note" id="nlNote"></p>
      <p class="news-success" data-od-id="newsletter-success" role="status" aria-live="polite">Merci ! Bienvenue dans la communauté.</p>
    </div>
  </section>
</main>
