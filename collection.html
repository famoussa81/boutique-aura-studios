<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Store",
  "name": "SNEAK BAMAKO",
  "description": "Claquettes, mules et sabots des grandes marques, en pointures 39 à 45.",
  "image": "assets/hero.webp",
  "address": { "@type": "PostalAddress", "addressLocality": "Bamako", "addressCountry": "ML" },
  "priceRange": "18000-42000 FCFA",
  "currenciesAccepted": "XOF",
  "paymentAccepted": "Espèces à la livraison"
}
</script>
<link rel="stylesheet" href="boutique.css" />
</head>
<body data-page="collection">
<main id="page">
<!-- Entête d'une collection ouverte. Masqué par défaut, il ne coûte rien
       à une boutique qui n'en déclare aucune. -->
  <section class="cbanner" id="collBanniere">
    <img id="collImage" alt="" width="1600" height="900" decoding="async" hidden />
    <div class="wrap">
      <div class="cbanner-content">
        <span class="sec-kicker" id="collKicker">Collection</span>
        <h2 id="collTitre"></h2>
        <p id="collTexte"></p>
        <div class="cbanner-actions">
          <a href="catalogue.html" class="btn btn-light">Voir tout le catalogue</a>
        </div>
      </div>
    </div>
  </section>

  <section class="section" id="produits" data-od-id="products">
    <div class="wrap">
      <div class="sec-head">
        <span class="sec-kicker">La sélection</span>
        <h2 class="sec-title" id="nouveautes" data-od-id="products-title">Les modèles disponibles</h2>
        <p class="sec-sub">Chaque modèle est présenté avec ses pointures et ses coloris réellement en stock.</p>
      </div>
      <div class="tabs" id="filterTabs" data-od-id="filter-tabs" role="tablist">
        <button class="tab active" data-filter="tous">Tous</button>
      </div>
      <div class="pgrid" id="grid" data-od-id="product-grid"></div>
    </div>
  </section>

  <section class="news" id="nlSection" data-od-id="newsletter">
    <div class="wrap">
      <span class="sec-kicker" id="nlKicker" style="justify-content:center;color:color-mix(in srgb,#ffffff 60%,transparent);margin-bottom:18px"></span>
      <h2 id="nlTitre"></h2>
      <p id="nlTexte"></p>
      <form class="news-form" id="newsForm" data-od-id="newsletter-form" novalidate>
        <input type="email" id="newsEmail" placeholder="ton@email.com" aria-label="Adresse e-mail" required />
        <button type="submit" class="btn btn-light" data-od-id="newsletter-submit">S'inscrire</button>
      </form>
      <p class="news-note" id="nlNote"></p>
      <p class="news-success" data-od-id="newsletter-success" role="status" aria-live="polite">Merci ! Bienvenue dans la communauté.</p>
    </div>
  </section>
</main>

<script src="supabase.config.js"></script>
<script src="supabase-client.js"></script>
<script src="catalog.js"></script>
<script src="boutique.js"></script>
</body>
</html>
